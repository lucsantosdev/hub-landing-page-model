<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="12" fill="#222"/>
  <!-- "Se" text -->
  <text x="28" y="62" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">Se</text>
  <!-- Magnifying glass circle -->
  <circle cx="76" cy="66" r="11" fill="none" stroke="#fa4f09" stroke-width="5"/>
  <!-- Magnifying glass handle -->
  <line x1="84" y1="74" x2="93" y2="83" stroke="#fa4f09" stroke-width="5" stroke-linecap="round"/>
  <!-- Dollar sign inside glass -->
  <text x="76" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fa4f09">$</text>
</svg>
